name: lab12-excursions
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: excursions
      POSTGRES_USER: excursions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excursions -d excursions"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 384m
  api:
    build:
      context: .
      target: production
    environment: &db-env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: excursions
      POSTGRES_USER: excursions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
  adminer:
    image: adminer:5
    environment: {ADMINER_DEFAULT_SERVER: db}
    ports: ["127.0.0.1:${DB_UI_PORT:-8088}:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      <<: *db-env
      POSTGRES_DB: excursions_test
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
  postman:
    profiles: ["checks"]
    image: postman/newman:alpine
    volumes:
      - ./postman:/etc/newman:ro
      - ./evidence:/reports
    command: ["run", "/etc/newman/excursions.postman_collection.json", "--env-var", "base_url=http://api:8000", "--reporters", "cli,json,junit", "--reporter-json-export", "/reports/newman.json", "--reporter-junit-export", "/reports/newman.xml", "--color", "off"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
volumes:
  pgdata:
